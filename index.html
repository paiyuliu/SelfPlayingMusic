<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SelfPlayingMusic 自彈自唱</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="jianpu.space/MMLNote.js"></script>
  <script src="jianpu.space/MMLPart.js"></script>
  <script src="jianpu.space/MMLPlayer.js"></script>
  <script src="jianpu.space/je.js"></script>
  <style>
    :root {
      --bg:         #0d0d1a;
      --surface:    #181828;
      --surface2:   #22223a;
      --border:     #2e2e50;
      --accent:     #7c5cbf;
      --hot:        #c45ca8;
      --text:       #e0e0f0;
      --dim:        #6868a0;
      --green:      #4caf70;
      --white-key:  #f4eeff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      gap: 14px;
    }

    /* ── Header ──────────────────────────────── */
    header { text-align: center; margin-bottom: 4px; }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--accent), var(--hot));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { font-size: 0.8rem; color: var(--dim); margin-top: 3px; }

    /* ── Card ────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      width: 100%;
      max-width: 700px;
    }
    .card-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--dim);
      margin-bottom: 14px;
    }
    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    /* ── BPM ─────────────────────────────────── */
    .bpm-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .bpm-center { display: flex; flex-direction: column; align-items: center; }
    .bpm-num {
      font-size: 3.8rem;
      font-weight: 800;
      line-height: 1;
      color: var(--accent);
      cursor: ns-resize;
      user-select: none;
      min-width: 100px;
      text-align: center;
    }
    .bpm-unit { font-size: 0.68rem; color: var(--dim); letter-spacing: 2px; margin-top: 2px; }

    .btn-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 1.4rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
      line-height: 1;
    }
    .btn-icon:hover  { background: var(--accent); border-color: var(--accent); }
    .btn-icon:active { transform: scale(0.9); }

    .bpm-input {
      width: 76px; padding: 8px 6px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 1rem;
      text-align: center;
      outline: none;
      transition: border-color 0.15s;
    }
    .bpm-input:focus { border-color: var(--accent); }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: var(--surface2);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      transition: transform 0.1s;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.25); }

    /* ── Toggle ──────────────────────────────── */
    .toggle-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .toggle-wrap { display: inline-block; position: relative; width: 48px; height: 26px; }
    .toggle-wrap input { opacity: 0; width: 0; height: 0; }
    .tog-slider {
      position: absolute; inset: 0;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 13px;
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s;
    }
    .tog-slider::before {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      background: white; border-radius: 50%;
      top: 3px; left: 3px;
      transition: left 0.25s;
    }
    .toggle-wrap input:checked + .tog-slider { background: var(--accent); border-color: var(--accent); }
    .toggle-wrap input:checked + .tog-slider::before { left: 25px; }

    /* ── Pill buttons ────────────────────────── */
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-pill {
      padding: 9px 20px;
      border-radius: 50px;
      border: 2px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-pill:hover   { border-color: var(--accent); color: var(--accent); }
    .btn-pill.active  { background: var(--accent); border-color: var(--accent); color: white; }
    .btn-pill:active  { transform: scale(0.96); }

    /* ── On-screen keyboard ───────────────────── */
    .keyboard-wrap {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 4px 0 2px;
    }
    .key-btn {
      width: 80px; height: 134px;
      background: var(--white-key);
      border-radius: 0 0 10px 10px;
      border: 1px solid #b0a0cc;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding-bottom: 14px;
      cursor: pointer;
      user-select: none;
      transition: background 0.07s, transform 0.07s, box-shadow 0.07s;
      box-shadow: 0 5px 10px rgba(0,0,0,0.35);
    }
    .key-btn:hover  { background: #e2d4ff; }
    .key-btn.pressed {
      background: var(--hot);
      transform: translateY(3px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    .key-btn .k-note { font-size: 1.1rem; font-weight: 700; color: #2a1a3a; }
    .key-btn .k-hint { font-size: 0.68rem; color: #9980b0; margin-top: 3px; }
    .key-btn.pressed .k-note,
    .key-btn.pressed .k-hint { color: rgba(255,255,255,0.9); }

    /* ── Status / Playing ───────────────────── */
    .playing-display {
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      min-height: 2.6rem;
      color: var(--hot);
      text-shadow: 0 0 24px rgba(196,92,168,0.5);
      letter-spacing: 1px;
    }
    .beat-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 12px;
      margin-bottom: 4px;
    }
    .beat {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--surface2);
      border: 2px solid var(--border);
      transition: background 0.05s, border-color 0.05s, box-shadow 0.05s;
    }
    .beat.active {
      background: var(--hot);
      border-color: var(--hot);
      box-shadow: 0 0 10px var(--hot);
    }
    .beat.metro {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .status-row {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }
    .status-item {
      flex: 1;
      background: var(--surface2);
      border-radius: 10px;
      padding: 10px 14px;
    }
    .status-label { font-size: 0.66rem; color: var(--dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
    .status-val   { font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #444466;
      flex-shrink: 0;
    }
    .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }

    /* ── Help hint ───────────────────────────── */
    .hint-bar {
      font-size: 0.75rem;
      color: var(--dim);
      text-align: center;
      max-width: 700px;
      line-height: 1.6;
    }

    /* ── Melody / Jianpu section ─────────────── */
    .song-select {
      flex: 1;
      min-width: 0;
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .song-select:focus { border-color: var(--accent); }

    #jianpuInput {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.82rem;
      font-family: monospace;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }
    #jianpuInput:focus { border-color: var(--accent); }

    .jianpu-display {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 2px 0;
      overflow-y: auto;
      max-height: 340px;
      padding: 8px 0 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .jianpu-display svg {
      font-size: 20px;
      fill: var(--text);
      flex-shrink: 0;
      overflow: visible;
    }
    .jianpu-display .play-mark { fill: transparent; }
    .jianpu-display g.playing .play-mark {
      fill: var(--accent);
      opacity: 0.38;
    }
    .jianpu-display .accidental { font-size: 12px; }
    .jianpu-display .chord-label {
      font-size: 11px;
      font-weight: 700;
      fill: var(--hot);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* ── Responsive ──────────────────────────── */
    @media (max-width: 560px) {
      .key-btn { width: 42px; height: 90px; }
      .key-btn .k-note { font-size: 0.85rem; }
      .key-btn .k-hint { font-size: 0.6rem; }
      .bpm-num { font-size: 2.8rem; }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>

<header>
  <h1>SelfPlayingMusic</h1>
  <p class="subtitle">自彈自唱伴奏系統 &nbsp;·&nbsp; 目標 1 ＋ 2</p>
</header>

<!-- BPM Card -->
<div class="card">
  <div class="card-title">BPM 速度</div>
  <div class="bpm-row">
    <button class="btn-icon" id="bpmDown" title="BPM −5">−</button>
    <div class="bpm-center">
      <div class="bpm-num" id="bpmDisplay" title="滾輪可調整 BPM">120</div>
      <div class="bpm-unit">BPM</div>
    </div>
    <button class="btn-icon" id="bpmUp" title="BPM +5">+</button>
    <input type="number" class="bpm-input" id="bpmInput" value="120" min="40" max="240" title="直接輸入 BPM">
  </div>
  <input type="range" id="bpmSlider" min="40" max="240" value="120">
  <div class="toggle-row">
    <label class="toggle-wrap" title="開啟節拍器聲音">
      <input type="checkbox" id="metroCheck">
      <span class="tog-slider"></span>
    </label>
    <span style="font-size:0.9rem">節拍器聲音</span>
  </div>
</div>

<!-- Settings Card -->
<div class="card">
  <div class="card-title">音色</div>
  <div class="btn-group" id="timbreGroup">
    <button class="btn-pill active" data-v="piano">鋼琴</button>
    <button class="btn-pill"        data-v="organ">管風琴</button>
    <button class="btn-pill"        data-v="harmonium">Harmonium</button>
    <button class="btn-pill"        data-v="guitar-acoustic">木吉他</button>
    <button class="btn-pill"        data-v="guitar-nylon">尼龍吉他</button>
    <button class="btn-pill"        data-v="harp">豎琴</button>
  </div>
  <div class="divider"></div>
  <div class="card-title">和弦類型</div>
  <div class="btn-group" id="chordGroup">
    <button class="btn-pill active" data-v="major">大三和弦</button>
    <button class="btn-pill"        data-v="minor">小三和弦</button>
    <button class="btn-pill"        data-v="root-chord">根音＋和弦</button>
    <button class="btn-pill"        data-v="arpeggio">琶音（大三）</button>
  </div>
  <div class="divider"></div>
  <div class="card-title">和弦拍數</div>
  <div class="btn-group" id="beatsGroup">
    <button class="btn-pill"        data-v="1">1 拍</button>
    <button class="btn-pill"        data-v="2">2 拍</button>
    <button class="btn-pill"        data-v="3">3 拍</button>
    <button class="btn-pill active" data-v="4">4 拍</button>
  </div>
</div>

<!-- Keyboard Card -->
<div class="card">
  <div class="card-title">觸發和弦 · 點擊琴鍵或按鍵盤 C D E F G A B</div>
  <div class="keyboard-wrap" id="keyboard"></div>
</div>

<!-- Status Card -->
<div class="card">
  <div class="playing-display" id="playingDisplay">—</div>
  <div class="beat-row">
    <div class="beat" id="b0"></div>
    <div class="beat" id="b1"></div>
    <div class="beat" id="b2"></div>
    <div class="beat" id="b3"></div>
  </div>
  <div class="status-row">
    <div class="status-item">
      <div class="status-label">MIDI 鍵盤</div>
      <div class="status-val"><span class="dot" id="midiDot"></span><span id="midiText">未連接</span></div>
    </div>
    <div class="status-item">
      <div class="status-label">音訊引擎</div>
      <div class="status-val"><span class="dot" id="audioDot"></span><span id="audioText">待機（按任意鍵啟動）</span></div>
    </div>
  </div>
</div>

<!-- Melody Card (目標2) -->
<div class="card">
  <div class="card-title">主旋律 · 簡譜播放</div>

  <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px;">
    <select id="songSelect" class="song-select">
      <option value="miss_you">好想你 — 四葉草</option>
      <option value="birthday">生日快樂</option>
      <option value="jingle_bells">叮叮噹 (Jingle Bells)</option>
      <option value="twinkle_star">一閃一閃亮晶晶 (Twinkle Star)</option>
      <option value="custom">貼上自訂簡譜…</option>
    </select>
    <button class="btn-pill active" id="loadSongBtn" style="white-space:nowrap;">載入</button>
  </div>

  <div id="customInputWrap" style="display:none; margin-bottom:12px;">
    <textarea id="jianpuInput" rows="6" placeholder="在此貼上簡譜文字（jianpu.space 格式）…"></textarea>
    <button class="btn-pill" id="parseBtn" style="margin-top:8px;">解析並顯示</button>
  </div>

  <div id="melodyControls" style="display:none; margin-bottom:8px;">
    <div class="btn-group">
      <button class="btn-pill active" id="melPlayBtn">▶ 播放</button>
      <button class="btn-pill" id="melPauseBtn">⏸ 暫停</button>
      <button class="btn-pill" id="melStopBtn">⏹ 停止</button>
      <span id="melBpmLabel" style="font-size:0.82rem; color:var(--dim); align-self:center;"></span>
    </div>
  </div>

  <div id="jianpuDisplay" class="jianpu-display"></div>
</div>

<p class="hint-bar">
  鍵盤快速鍵：<strong>C D E F G A B</strong> 觸發和弦 &nbsp;·&nbsp;
  <strong>↑ ↓</strong> 調整 BPM &nbsp;·&nbsp;
  滾輪在 BPM 數字上也可調整
</p>

<script>
'use strict';

// ═══════════════════════════════════════════════════════
//  Sample map helpers
// ═══════════════════════════════════════════════════════
const SHARP_MAP = { Cs:'C#', Ds:'D#', Fs:'F#', Gs:'G#', As:'A#' };
function sm(notes, octaves) {
  const out = {};
  for (const oct of octaves)
    for (const n of notes)
      out[(SHARP_MAP[n] || n) + oct] = n + oct + '.mp3';
  return out;
}
const A12 = ['C','Cs','D','Ds','E','F','Fs','G','Gs','A','As','B'];

// ═══════════════════════════════════════════════════════
//  Instrument definitions
// ═══════════════════════════════════════════════════════
const INSTRUMENT_DEFS = {
  piano: {
    label: '鋼琴', vol: -6,
    baseUrl: 'samples/piano/',
    urls: { ...sm(A12, [1,2,3,4,5,6,7]), 'C8':'C8.mp3' }
  },
  organ: {
    label: '管風琴', vol: -8,
    baseUrl: 'samples/organ/',
    urls: { ...sm(['C','Ds','Fs','A'], [1,2,3,4,5]), 'C6':'C6.mp3' }
  },
  harmonium: {
    label: 'Harmonium', vol: -6,
    baseUrl: 'samples/harmonium/',
    urls: {
      ...sm(A12, [2,3]),
      ...sm(['C','Cs','D','Ds','E','F','G','Gs','A','As','B'], [4]),
      'C5':'C5.mp3', 'C#5':'Cs5.mp3', 'D5':'D5.mp3'
    }
  },
  'guitar-acoustic': {
    label: '木吉他', vol: -4,
    baseUrl: 'samples/guitar-acoustic/',
    urls: {
      ...sm(A12, [3,4]),
      ...sm(['A','As','B','D','Ds','E','F','Fs','G','Gs'], [2]),
      'C5':'C5.mp3', 'C#5':'Cs5.mp3', 'D5':'D5.mp3'
    }
  },
  'guitar-nylon': {
    label: '尼龍吉他', vol: -4,
    baseUrl: 'samples/guitar-nylon/',
    urls: {
      'B1':'B1.mp3',
      'D2':'D2.mp3','E2':'E2.mp3','F#2':'Fs2.mp3','G#2':'Gs2.mp3','A2':'A2.mp3','B2':'B2.mp3',
      'C#3':'Cs3.mp3','D3':'D3.mp3','E3':'E3.mp3','F#3':'Fs3.mp3','G3':'G3.mp3','A3':'A3.mp3','B3':'B3.mp3',
      'C#4':'Cs4.mp3','D#4':'Ds4.mp3','E4':'E4.mp3','F#4':'Fs4.mp3','G#4':'Gs4.mp3','A4':'A4.mp3','B4':'B4.mp3',
      'C#5':'Cs5.mp3','D5':'D5.mp3','E5':'E5.mp3','F#5':'Fs5.mp3','G5':'G5.mp3','G#5':'Gs5.mp3','A5':'A5.mp3','A#5':'As5.mp3'
    }
  },
  harp: {
    label: '豎琴', vol: -4,
    baseUrl: 'samples/harp/',
    urls: {
      'E1':'E1.mp3','G1':'G1.mp3','B1':'B1.mp3',
      'D2':'D2.mp3','F2':'F2.mp3','A2':'A2.mp3',
      'C3':'C3.mp3','E3':'E3.mp3','G3':'G3.mp3','B3':'B3.mp3',
      'D4':'D4.mp3','F4':'F4.mp3','A4':'A4.mp3',
      'C5':'C5.mp3','E5':'E5.mp3','G5':'G5.mp3','B5':'B5.mp3',
      'F6':'F6.mp3','A6':'A6.mp3','B6':'B6.mp3',
      'D7':'D7.mp3','F7':'F7.mp3'
    }
  }
};

// ═══════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════
let bpm        = 120;
let chordType  = 'major';
let timbre     = 'piano';
let metroOn    = false;
let audioReady = false;
let chordBeats = 4;

const samplerCache = {};        // name → Tone.Sampler instance
const samplerReady = new Set(); // names whose onload has fired
let playingSampler = null;

// ═══════════════════════════════════════════════════════
//  Metronome synth (kept synthetic)
// ═══════════════════════════════════════════════════════
let metSynth = null;
let metSeq   = null;

// ═══════════════════════════════════════════════════════
//  Audio init
// ═══════════════════════════════════════════════════════
async function initAudio() {
  if (audioReady) return;
  await Tone.start();
  audioReady = true;
  Tone.Transport.bpm.value = bpm;
  Tone.Transport.start();

  metSynth = new Tone.Synth({
    oscillator: { type: 'triangle' },
    envelope:   { attack: 0.001, decay: 0.07, sustain: 0, release: 0.04 },
    volume: -6
  }).toDestination();

  setAudioStatus(true, '就緒');
  applyMetronome();
  loadSampler('piano'); // preload default
}

function loadSampler(name) {
  if (samplerCache[name]) return; // already loading or loaded
  const def = INSTRUMENT_DEFS[name];
  if (!def) return;
  const s = new Tone.Sampler({
    urls:    def.urls,
    baseUrl: def.baseUrl,
    volume:  def.vol ?? 0,
    onload: () => {
      samplerReady.add(name);
      if (name === timbre) setAudioStatus(true, '就緒');
    }
  }).toDestination();
  samplerCache[name] = s;
}

// ═══════════════════════════════════════════════════════
//  Metronome
// ═══════════════════════════════════════════════════════
function applyMetronome() {
  if (metSeq) { metSeq.stop(); metSeq.dispose(); metSeq = null; }
  if (!metroOn || !audioReady) return;
  metSeq = new Tone.Sequence((time, i) => {
    const freq = (i === 0) ? 880 : 660;
    metSynth.triggerAttackRelease(freq, '32n', time);
    const delayMs = Math.max(0, (time - Tone.now()) * 1000);
    setTimeout(() => flashMetro(i), delayMs);
  }, [0,1,2,3], '4n');
  metSeq.start(0);
}

function flashMetro(beat) {
  document.querySelectorAll('.beat').forEach((el, i) => {
    // Don't override an active chord-beat dot
    if (!el.classList.contains('active')) {
      el.classList.toggle('metro', i === beat);
    }
  });
}

// ═══════════════════════════════════════════════════════
//  Chord helpers
// ═══════════════════════════════════════════════════════
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function midiToName(midi) {
  return NOTE_NAMES[midi % 12] + (Math.floor(midi / 12) - 1);
}

function getChordMidis(root) {
  return (chordType === 'minor' ? [0,3,7] : [0,4,7]).map(i => root + i);
}

function chordLabel() {
  return { major:'大三和弦', minor:'小三和弦', 'root-chord':'根音＋和弦', arpeggio:'琶音' }[chordType];
}

// ═══════════════════════════════════════════════════════
//  Playback
// ═══════════════════════════════════════════════════════
let beatTimers = [];

function cancelCurrent() {
  if (playingSampler) { try { playingSampler.releaseAll(); } catch(e) {} }
  playingSampler = null;
  beatTimers.forEach(clearTimeout);
  beatTimers = [];
}

function clearBeatDots() {
  for (let i = 0; i < 4; i++)
    document.getElementById('b' + i).classList.remove('active');
}

async function triggerChord(rootMidi) {
  await initAudio();

  if (!samplerReady.has(timbre)) {
    loadSampler(timbre);
    setAudioStatus(true, '載入音色中…');
    return;
  }

  cancelCurrent();

  const syn = samplerCache[timbre];
  playingSampler = syn;

  const midis = getChordMidis(rootMidi);
  const notes = midis.map(midiToName); // e.g. ['C4','E4','G4']
  const beatSec = 60 / bpm;
  const now = Tone.now() + 0.02;

  const isFixed = (chordType === 'root-chord' || chordType === 'arpeggio');
  const activeBeatCount = isFixed ? 4 : chordBeats;
  const chordDuration   = beatSec * activeBeatCount;
  const beatsLabel      = isFixed ? '' : ` (${chordBeats}拍)`;

  document.getElementById('playingDisplay').textContent =
    midiToName(rootMidi) + '  ' + chordLabel() + beatsLabel;

  if (chordType === 'major' || chordType === 'minor') {
    syn.triggerAttackRelease(notes, chordDuration, now);
  } else if (chordType === 'root-chord') {
    syn.triggerAttackRelease(notes[0], beatSec * 0.88, now);
    for (let i = 1; i <= 3; i++)
      syn.triggerAttackRelease(notes, beatSec * 0.88, now + i * beatSec);
  } else {
    // Arpeggio: Root → 3rd → 5th → 3rd
    [notes[0], notes[1], notes[2], notes[1]].forEach((n, i) => {
      syn.triggerAttackRelease(n, beatSec * 0.88, now + i * beatSec);
    });
  }

  for (let i = 0; i < activeBeatCount; i++) {
    beatTimers.push(setTimeout(() => {
      clearBeatDots();
      document.getElementById('b' + i).classList.add('active');
    }, i * beatSec * 1000 + 20));
  }
  beatTimers.push(setTimeout(() => {
    clearBeatDots();
    document.getElementById('playingDisplay').textContent = '—';
  }, (chordDuration + 0.15) * 1000));
}

// ═══════════════════════════════════════════════════════
//  MIDI
// ═══════════════════════════════════════════════════════
async function initMidi() {
  if (!navigator.requestMIDIAccess) {
    setMidiStatus(false, '瀏覽器不支援 Web MIDI');
    return;
  }
  try {
    const access = await navigator.requestMIDIAccess();
    const bind = () => {
      access.inputs.forEach(port => { port.onmidimessage = onMidiMessage; });
      setMidiStatus(access.inputs.size > 0, null, access.inputs.size);
    };
    bind();
    access.onstatechange = bind;
  } catch {
    setMidiStatus(false, '權限被拒絕');
  }
}

function onMidiMessage(ev) {
  const [status, note, velocity] = ev.data;
  const cmd = status & 0xf0;
  if (cmd === 0x90 && velocity > 0) triggerChord(note); // Note On
}

function setMidiStatus(ok, msg, count) {
  document.getElementById('midiDot').className  = 'dot' + (ok ? ' green' : '');
  document.getElementById('midiText').textContent =
    msg ?? (ok ? `已連接（${count} 裝置）` : '未連接');
}

function setAudioStatus(ok, msg) {
  document.getElementById('audioDot').className  = 'dot' + (ok ? ' green' : '');
  document.getElementById('audioText').textContent = msg ?? (ok ? '就緒' : '待機（按任意鍵啟動）');
}

// ═══════════════════════════════════════════════════════
//  On-screen keyboard
// ═══════════════════════════════════════════════════════
const KEYS = [
  { note: 'C', midi: 60, key: 'c' },
  { note: 'D', midi: 62, key: 'd' },
  { note: 'E', midi: 64, key: 'e' },
  { note: 'F', midi: 65, key: 'f' },
  { note: 'G', midi: 67, key: 'g' },
  { note: 'A', midi: 69, key: 'a' },
  { note: 'B', midi: 71, key: 'b' },
];

const kbContainer = document.getElementById('keyboard');
KEYS.forEach(({ note, midi, key }) => {
  const el = document.createElement('div');
  el.className   = 'key-btn';
  el.dataset.key = key;
  el.innerHTML   = `<span class="k-note">${note}</span><span class="k-hint">[${key.toUpperCase()}]</span>`;
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.classList.add('pressed');
    triggerChord(midi);
  });
  el.addEventListener('pointerup',    () => el.classList.remove('pressed'));
  el.addEventListener('pointercancel',() => el.classList.remove('pressed'));
  el.addEventListener('pointerleave', () => el.classList.remove('pressed'));
  kbContainer.appendChild(el);
});

// ═══════════════════════════════════════════════════════
//  Computer keyboard
// ═══════════════════════════════════════════════════════
const held = new Set();

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  const lk    = e.key.toLowerCase();
  const found = KEYS.find(k => k.key === lk);

  if (found && !held.has(lk)) {
    held.add(lk);
    document.querySelector(`.key-btn[data-key="${lk}"]`)?.classList.add('pressed');
    triggerChord(found.midi);
  }

  // BPM arrow keys (not when typing in the number input)
  if (document.activeElement !== document.getElementById('bpmInput')) {
    if (e.key === 'ArrowUp')   { e.preventDefault(); setBpm(bpm + 1); }
    if (e.key === 'ArrowDown') { e.preventDefault(); setBpm(bpm - 1); }
  }
});

document.addEventListener('keyup', e => {
  const lk = e.key.toLowerCase();
  held.delete(lk);
  document.querySelector(`.key-btn[data-key="${lk}"]`)?.classList.remove('pressed');
});

// ═══════════════════════════════════════════════════════
//  BPM
// ═══════════════════════════════════════════════════════
function setBpm(v) {
  bpm = Math.max(40, Math.min(240, Math.round(+v || 120)));
  document.getElementById('bpmDisplay').textContent = bpm;
  document.getElementById('bpmSlider').value        = bpm;
  document.getElementById('bpmInput').value         = bpm;
  if (audioReady) Tone.Transport.bpm.value = bpm;
}

document.getElementById('bpmDown').addEventListener('click', () => setBpm(bpm - 5));
document.getElementById('bpmUp'  ).addEventListener('click', () => setBpm(bpm + 5));

document.getElementById('bpmSlider').addEventListener('input',
  e => setBpm(e.target.value));

document.getElementById('bpmInput').addEventListener('change',
  e => setBpm(e.target.value));

document.getElementById('bpmInput').addEventListener('keydown', e => {
  if (e.key === 'ArrowUp')   { e.preventDefault(); setBpm(bpm + 1); }
  if (e.key === 'ArrowDown') { e.preventDefault(); setBpm(bpm - 1); }
});

// Scroll wheel on the big BPM number
document.getElementById('bpmDisplay').addEventListener('wheel', e => {
  e.preventDefault();
  setBpm(bpm + (e.deltaY < 0 ? 1 : -1));
}, { passive: false });

// ═══════════════════════════════════════════════════════
//  Timbre & Chord type buttons
// ═══════════════════════════════════════════════════════
document.getElementById('timbreGroup').addEventListener('click', e => {
  const v = e.target.dataset.v;
  if (!v) return;
  document.querySelectorAll('#timbreGroup .btn-pill')
    .forEach(b => b.classList.toggle('active', b.dataset.v === v));
  timbre = v;
  if (audioReady) {
    if (!samplerReady.has(v)) {
      loadSampler(v);
      setAudioStatus(true, '載入音色中…');
    } else {
      setAudioStatus(true, '就緒');
    }
  }
});

document.getElementById('chordGroup').addEventListener('click', e => {
  const v = e.target.dataset.v;
  if (!v) return;
  document.querySelectorAll('#chordGroup .btn-pill')
    .forEach(b => b.classList.toggle('active', b.dataset.v === v));
  chordType = v;
});

document.getElementById('beatsGroup').addEventListener('click', e => {
  const v = e.target.dataset.v;
  if (!v) return;
  document.querySelectorAll('#beatsGroup .btn-pill')
    .forEach(b => b.classList.toggle('active', b.dataset.v === v));
  chordBeats = parseInt(v, 10);
});

// ═══════════════════════════════════════════════════════
//  Metronome toggle
// ═══════════════════════════════════════════════════════
document.getElementById('metroCheck').addEventListener('change', async e => {
  metroOn = e.target.checked;
  await initAudio();
  applyMetronome();
  if (!metroOn) {
    document.querySelectorAll('.beat').forEach(b => b.classList.remove('metro'));
  }
});

// ═══════════════════════════════════════════════════════
//  Boot
// ═══════════════════════════════════════════════════════
initMidi();
</script>

<script>
'use strict';

// ═══════════════════════════════════════════════════════
//  Jianpu audio engine — shares Tone.js AudioContext
//  so melody and chord sampler are perfectly time-synced
// ═══════════════════════════════════════════════════════
function initJianpuAudio() {
  // rawContext = native AudioContext used by Tone.js
  window.actx = Tone.getContext().rawContext;
  window.master = actx.createGain();
  window.master.connect(actx.destination);
  window.stoppedSound = actx.createGain();
  window.stoppedSound.gain.value = 0;
  window.stoppedSound.connect(actx.destination);
  window.fakePno = {}; // stub; playSound is overridden below
}

window.addEventListener('load', initJianpuAudio);

// ═══════════════════════════════════════════════════════
//  Patch MMLPlayer for auto-scroll
// ═══════════════════════════════════════════════════════
const _origShowNote = MMLPlayer.prototype.showNote;
MMLPlayer.prototype.showNote = function (n, i) {
  _origShowNote.call(this, n, i);
  const el = this.view.notes[n.source]?.span;
  if (el) {
    const svg = el.closest('svg') || el;
    svg.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
  }
};

// Override MMLPlayer audio → use the selected Tone.js Sampler (real samples)
MMLPlayer.prototype.playSound = function (note, id) {
  if (note.type === 'rest') return;
  // Follow tie chain to get total duration
  let nn = note;
  while (nn.tieAfter) nn = nn.tieAfter;
  const startTime = this.startTime + note.startTime;
  const duration  = Math.max(0.05, this.startTime + nn.endTime - startTime);
  const noteName  = NOTE_NAMES[note.pitch % 12] + (Math.floor(note.pitch / 12) - 1);
  const sampler   = samplerCache[timbre];
  if (sampler && samplerReady.has(timbre)) {
    try { sampler.triggerAttackRelease(noteName, duration, startTime); } catch (e) {}
  }
  this.sounds[id] = {}; // lightweight tracking entry
};

MMLPlayer.prototype.stopSound = function () {
  clearTimeout(this.playId);
  this.playId = 0;
  try { samplerCache[timbre]?.releaseAll?.(); } catch (e) {}
  this.sounds = {};
};

// ═══════════════════════════════════════════════════════
//  Melody section logic
// ═══════════════════════════════════════════════════════
let currentScore = null;
let melodyPlayer = null;

const PRESET_SONGS = {
  miss_you:     'jianpu.space/miss_you.txt',
  birthday:     'jianpu.space/birthday.txt',
  jingle_bells: 'jianpu.space/jingle_bells.txt',
  twinkle_star: 'jianpu.space/twinkle_star.txt'
};

async function fetchSong(name) {
  const res = await fetch(PRESET_SONGS[name]);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.text();
}

function renderScore(text) {
  const display = document.getElementById('jianpuDisplay');
  display.innerHTML = '';

  // ── Map H: chord lines to each note line's measures ──────────
  // H: lines placed immediately before a note line apply to that line's measures.
  // A note line is any line containing '|'. Chords are assigned left-to-right per measure.
  const rawLines = text.split('\n');
  const chordsByMeasure = {};  // measureIdx → chord string
  const cleanLines = [];
  let pendingChords = [];
  let measureIdx = 0;
  for (const line of rawLines) {
    if (line.startsWith('H:')) {
      pendingChords.push(...line.slice(2).trim().split(/\s+/).filter(Boolean));
    } else {
      if (line.includes('|')) {  // note line — consume pending H: tokens
        const barCount = (line.match(/\|/g) || []).length;
        for (let k = 0; k < barCount && k < pendingChords.length; k++) {
          chordsByMeasure[measureIdx + k] = pendingChords[k];
        }
        pendingChords = [];
        measureIdx += barCount;
      }
      cleanLines.push(line);
    }
  }
  const chords = chordsByMeasure;

  const score = parseJianpu(cleanLines.join('\n'), undefined, undefined);
  if (!score || score.length === 0) return;

  // Extra top padding when chord labels are present
  const hasChords = Object.values(chords).some(c => c && c !== '-');
  const noteY     = hasChords ? 48 : 34;  // shift notes down to make room
  const CHORD_Y   = 11;                   // chord label baseline

  const svgList = [];
  let maxY = 0;

  // First pass: notes and bars
  for (let i = 0; i < score.length; i++) {
    const meas = score[i];
    const svg = createSVG('svg', { width: meas.length * 15, height: noteY + 23 });
    let x = 0, beat = 0, connect = false, y = 0;

    for (let j = 0; j < meas.length; j++) {
      const item = meas[j];
      if (item instanceof Note) {
        beat += item.duration.getBeat();
        const connectR = item.duration.type > 0
          && (beat - Math.floor(beat)) !== 0
          && meas[j + 1] instanceof Note
          && meas[j + 1].duration.type > 0;
        svg.appendChild(item.render(x, noteY, connect, connectR));
        connect = connectR;
        y = Math.max(y, item.getMaxY());
      } else {
        svg.appendChild(item.render(x, noteY));
      }
      x += item.getWidth();
    }
    svg.width.baseVal.value = x;
    svg.height.baseVal.value = noteY + y;
    svgList.push(svg);
    maxY = Math.max(maxY, y);

    // Chord label
    if (chords[i] && chords[i] !== '-') {
      svg.insertBefore(
        createSVGText(chords[i], { x: 2, y: CHORD_Y, class: 'chord-label' }),
        svg.firstChild
      );
    }

    display.appendChild(svg);
  }

  // Second pass: lyrics
  for (let i = 0; i < score.length; i++) {
    const meas = score[i];
    const svg  = svgList[i];
    let x = 0;
    for (let j = 0; j < meas.length; j++) {
      if (meas[j] instanceof Note && meas[j].lyrics)
        svg.appendChild(meas[j].renderLyrics(x, maxY + noteY - 2));
      x += meas[j].getWidth();
    }
    svg.height.baseVal.value = noteY + 4 + maxY;
  }

  currentScore = score;
  document.getElementById('melodyControls').style.display = '';
  document.getElementById('melBpmLabel').textContent = '♩ = ' + (score[0]?.bpm || 120);
}

function buildAndPlayMelody(score) {
  const part = new MMLPart(0);
  const tempos = [];
  const myKey = score.key != null ? score.key : 0;
  let tmpKey = 0;
  const view = { notes: [] };
  let beat = 0;
  let oldPitch = 'rest';

  for (let i = 0; i < score.length; i++) {
    const me = score[i];
    tempos.push({ position: beat, bpm: me.bpm });

    for (let j = 0; j < me.length; j++) {
      const item = me[j];
      if (!(item instanceof Note)) continue;
      if (item.transpose) tmpKey += item.transpose;

      const du = 4 * Math.pow(2, item.duration.type) / item.duration.mul;
      const step = item.pitch.step;
      let pitch;

      if (step === '0') {
        pitch = 'rest';
      } else if (step >= '1' && step <= '7') {
        pitch = [0, 0, 2, 4, 5, 7, 9, 11][+step] + 60 + item.pitch.octave * 12;
        const acc = item.pitch.accidental;
        if (acc === '♯')  pitch += 1;
        if (acc === '♯♯') pitch += 2;
        if (acc === '♭')  pitch -= 1;
        if (acc === '♭♭') pitch -= 2;
        pitch += myKey + tmpKey;
      } else if (step === '-') {
        pitch = oldPitch;
        if (part.notes.length > 0) part.notes[part.notes.length - 1].tieAfter = true;
      } else {
        pitch = 'rest';
      }

      const note = new MMLNote(pitch, du, item.duration.dots);
      note.source = view.notes.length;
      view.notes.push({ span: item.note_svg });
      part.addNote(note);
      oldPitch = pitch;
      beat += 1 / du * (2 - Math.pow(0.5, note.dots));
    }
  }

  part.setTempo(tempos);
  part.connectTie();

  const player = new MMLPlayer(part);
  player.view = view;
  player.play();
  return player;
}

// ── UI event handlers ──────────────────────────────────
document.getElementById('songSelect').addEventListener('change', function () {
  const isCustom = this.value === 'custom';
  document.getElementById('customInputWrap').style.display = isCustom ? '' : 'none';
  document.getElementById('melodyControls').style.display = 'none';
  document.getElementById('jianpuDisplay').innerHTML = '';
  currentScore = null;
  if (melodyPlayer) { melodyPlayer.stop(); melodyPlayer = null; }
});

document.getElementById('loadSongBtn').addEventListener('click', async function () {
  const val = document.getElementById('songSelect').value;
  if (val === 'custom') {
    document.getElementById('customInputWrap').style.display = '';
    return;
  }
  this.textContent = '載入中…';
  this.disabled = true;
  try {
    const text = await fetchSong(val);
    renderScore(text);
  } catch (e) {
    alert('載入失敗：' + e.message);
  } finally {
    this.textContent = '載入';
    this.disabled = false;
  }
});

document.getElementById('parseBtn').addEventListener('click', function () {
  const text = document.getElementById('jianpuInput').value.trim();
  if (text) renderScore(text);
});

document.getElementById('melPlayBtn').addEventListener('click', async function () {
  if (!window.actx) return;
  await actx.resume();
  if (melodyPlayer) { melodyPlayer.stop(); melodyPlayer = null; }
  if (!currentScore) return;
  melodyPlayer = buildAndPlayMelody(currentScore);
  melodyPlayer.onended = () => { melodyPlayer = null; };
});

document.getElementById('melPauseBtn').addEventListener('click', function () {
  if (melodyPlayer) melodyPlayer.pause();
});

document.getElementById('melStopBtn').addEventListener('click', function () {
  if (melodyPlayer) { melodyPlayer.stop(); melodyPlayer = null; }
});
</script>
</body>
